<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input Reader Test Page</title>
</head>
<body>
  <h2>Enter Reading</h2>
  <input type="text" id="reading" placeholder="Type something..." />
  <button onclick="readValue()">Submit</button>
  <p id="output"></p>

  <script>
    function readValue() {
      const val = document.getElementById('reading').value;
      document.getElementById('output').textContent = "Reading: " + val;
    }
  </script>
</body>
</html>
